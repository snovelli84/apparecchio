<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#358A61"/><stop offset="1" stop-color="#22603F"/>
    </linearGradient>
    <radialGradient id="plate" cx=".45" cy=".4" r=".7">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9F1EC"/>
    </radialGradient>
    <pattern id="quadri" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#FFFFFF" opacity=".07"/><rect x="32" y="32" width="32" height="32" fill="#FFFFFF" opacity=".07"/>
    </pattern>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#quadri)"/>
  <!-- ombra piatto -->
  <circle cx="256" cy="268" r="142" fill="#0E3A25" opacity=".28"/>
  <!-- piatto -->
  <circle cx="256" cy="256" r="142" fill="url(#plate)"/>
  <circle cx="256" cy="256" r="100" fill="none" stroke="#2E7A55" stroke-opacity=".22" stroke-width="8"/>
  <!-- cibo: spirale arancio (zucca) -->
  <path d="M256 196c38 0 58 28 58 58s-24 60-58 60c-28 0-46-20-46-44s18-38 38-38c16 0 26 12 26 24" fill="none" stroke="#E0782F" stroke-width="22" stroke-linecap="round"/>
  <!-- forchetta -->
  <g stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" fill="none">
    <path d="M60 112v78a26 26 0 0 0 52 0v-78"/>
    <path d="M86 112v288"/>
  </g>
  <!-- coltello -->
  <path d="M452 112c-32 22-40 64-40 124h40v164" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
